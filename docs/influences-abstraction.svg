<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="100%" role="img" aria-labelledby="t d">
<title id="t">The life of an abstraction</title>
<desc id="d">A cycle. An idea is compiled into a tool, a name or a module. In stable use nobody has to think about it. When the world shifts, the assumptions behind it fail and it leaks. Then a mind has to reason about it again, and recompiles and renames it.</desc>
<defs>
<marker id="hfw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hfw" d="M0 0 L10 5 L0 10 Z"/></marker>
<marker id="hbk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hbk" d="M0 0 L10 5 L0 10 Z"/></marker>
<marker id="hin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hin" d="M0 0 L10 5 L0 10 Z"/></marker>
</defs>
<style>
.judge{fill:#eaf2fd;stroke:#3a78c9} .core{fill:#1f6f43;stroke:#14512f} .chaos{fill:#fdf1e7;stroke:#d97a2b}
.ink{fill:#1f2328} .muted{fill:#4a525b} .on{fill:#ffffff} .git{fill:#8250df}
.fw{stroke:#57606a;fill:none} .bk{stroke:#3a78c9;fill:none} .in{stroke:#d97a2b;fill:none} .encl{stroke:#8c959f;fill:none}
.hfw{fill:#57606a} .hbk{fill:#3a78c9} .hin{fill:#d97a2b} .bkink{fill:#2f6db5} .grid{stroke:#d1d9e0}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme: dark){
.judge{fill:#12233a;stroke:#5b9be6} .core{fill:#2ea062;stroke:#7ee2a8} .chaos{fill:#2a1d12;stroke:#e08a3c}
.ink{fill:#f0f6fc} .muted{fill:#b1b8c0} .on{fill:#04150c} .git{fill:#c297ff}
.fw{stroke:#8b949e} .bk{stroke:#5b9be6} .in{stroke:#e08a3c} .encl{stroke:#6e7681}
.hfw{fill:#8b949e} .hbk{fill:#5b9be6} .hin{fill:#e08a3c} .bkink{fill:#7fb3f0} .grid{stroke:#30363d}
}
</style>
<rect class="chaos" x="8" y="8" width="22" height="14" rx="4" stroke-width="2" stroke-dasharray="4 3"/>
<text class="muted" x="36" y="20" font-size="12" text-anchor="start">me, or the world</text>
<rect class="judge" x="160" y="8" width="22" height="14" rx="4" stroke-width="2"/>
<text class="muted" x="188" y="20" font-size="12" text-anchor="start">a mind decides (person or agent)</text>
<rect class="core" x="390" y="8" width="22" height="14" rx="4" stroke-width="2"/>
<text class="muted" x="418" y="20" font-size="12" text-anchor="start">a program or structure holds it</text>
<rect class="core" x="40" y="50" width="230" height="80" rx="10" stroke-width="2"/>
<text class="on" x="155.0" y="71" font-size="15" font-weight="700" text-anchor="middle">Compiled</text>
<text class="on" x="155.0" y="88" font-size="12.5" text-anchor="middle">into a tool, a name, a module</text>
<text class="on" x="155.0" y="103" font-size="12.5" text-anchor="middle">Ousterhout, Ottinger</text>
<rect class="core" x="370" y="50" width="230" height="80" rx="10" stroke-width="2"/>
<text class="on" x="485.0" y="71" font-size="15" font-weight="700" text-anchor="middle">Stable use</text>
<text class="on" x="485.0" y="88" font-size="12.5" text-anchor="middle">nobody has to think about it</text>
<text class="on" x="485.0" y="103" font-size="12.5" text-anchor="middle">Flyxion: little intelligence needed</text>
<rect class="chaos" x="370" y="220" width="230" height="80" rx="10" stroke-width="2" stroke-dasharray="6 4"/>
<text class="ink" x="485.0" y="241" font-size="15" font-weight="700" text-anchor="middle">Assumptions shift</text>
<text class="muted" x="485.0" y="258" font-size="12.5" text-anchor="middle">the world moves under it</text>
<text class="muted" x="485.0" y="273" font-size="12.5" text-anchor="middle">Spolsky: it leaks</text>
<rect class="judge" x="40" y="220" width="230" height="80" rx="10" stroke-width="2"/>
<text class="ink" x="155.0" y="241" font-size="15" font-weight="700" text-anchor="middle">Exposed</text>
<text class="muted" x="155.0" y="258" font-size="12.5" text-anchor="middle">a mind reasons it out again</text>
<text class="muted" x="155.0" y="273" font-size="12.5" text-anchor="middle">Flyxion, O&#x27;Reilly</text>
<path class="fw" d="M270 90 L366 90" stroke-width="2" marker-end="url(#hfw)"/>
<path class="fw" d="M485 130 L485 216" stroke-width="2" marker-end="url(#hfw)"/>
<path class="fw" d="M370 260 L274 260" stroke-width="2" marker-end="url(#hfw)"/>
<path class="bk" d="M155 220 L155 134" stroke-width="2" marker-end="url(#hbk)"/>
<text class="bkink" x="165" y="182" font-size="12.5" text-anchor="start">recompile, rename</text>
</svg>
