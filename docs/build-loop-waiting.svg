<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" width="100%" role="img" aria-labelledby="t d">
<title id="t">How the session waits</title>
<desc id="d">The orchestrator works, then dispatches runs and holds. Each run is a hold item whose expected time is agentpace&#x27;s P80. vigil keepalive blocks until an event, with a window that follows the prompt cache&#x27;s time to live; the orchestrator acts on the evidence. Past the P80 an item is overdue. My messages go into workq and are worked in order. A usage limit pauses the session; near a full context it compacts at a boundary and resumes.</desc>
<defs>
<marker id="hfw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hfw" d="M0 0 L10 5 L0 10 Z"/></marker>
<marker id="hbk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hbk" d="M0 0 L10 5 L0 10 Z"/></marker>
<marker id="hin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hin" d="M0 0 L10 5 L0 10 Z"/></marker>
</defs>
<style>
.judge{fill:#eaf2fd;stroke:#3a78c9} .core{fill:#1f6f43;stroke:#14512f} .chaos{fill:#fdf1e7;stroke:#d97a2b}
.ink{fill:#1f2328} .muted{fill:#4a525b} .on{fill:#ffffff} .git{fill:#8250df}
.fw{stroke:#57606a;fill:none} .bk{stroke:#3a78c9;fill:none} .in{stroke:#d97a2b;fill:none} .encl{stroke:#8c959f;fill:none}
.hfw{fill:#57606a} .hbk{fill:#3a78c9} .hin{fill:#d97a2b} .bkink{fill:#2f6db5} .grid{stroke:#d1d9e0}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme: dark){
.judge{fill:#12233a;stroke:#5b9be6} .core{fill:#2ea062;stroke:#7ee2a8} .chaos{fill:#2a1d12;stroke:#e08a3c}
.ink{fill:#f0f6fc} .muted{fill:#b1b8c0} .on{fill:#04150c} .git{fill:#c297ff}
.fw{stroke:#8b949e} .bk{stroke:#5b9be6} .in{stroke:#e08a3c} .encl{stroke:#6e7681}
.hfw{fill:#8b949e} .hbk{fill:#5b9be6} .hin{fill:#e08a3c} .bkink{fill:#7fb3f0} .grid{stroke:#30363d}
}
</style>
<rect class="chaos" x="8" y="8" width="22" height="14" rx="4" stroke-width="2" stroke-dasharray="4 3"/>
<text class="muted" x="36" y="20" font-size="12" text-anchor="start">me, or the world</text>
<rect class="judge" x="150" y="8" width="22" height="14" rx="4" stroke-width="2"/>
<text class="muted" x="178" y="20" font-size="12" text-anchor="start">an agent decides</text>
<rect class="core" x="292" y="8" width="22" height="14" rx="4" stroke-width="2"/>
<text class="muted" x="320" y="20" font-size="12" text-anchor="start">a program decides</text>
<text class="git mono" x="440" y="20" font-size="12" text-anchor="start">git</text>
<line class="bk" x1="470" y1="16" x2="500" y2="16" stroke-width="2"/>
<text class="muted" x="506" y="20" font-size="12" text-anchor="start">back edge</text>
<rect class="judge" x="230" y="60" width="180" height="50" rx="10" stroke-width="2"/>
<text class="ink" x="320.0" y="90.0" font-size="15" font-weight="700" text-anchor="middle">Working</text>
<rect class="chaos" x="460" y="50" width="170" height="34" rx="10" stroke-width="2" stroke-dasharray="6 4"/>
<text class="ink" x="545.0" y="72.0" font-size="15" font-weight="700" text-anchor="middle">My message</text>
<rect class="core" x="460" y="120" width="170" height="64" rx="10" stroke-width="2"/>
<text class="on" x="545.0" y="141" font-size="15" font-weight="700" text-anchor="middle">workq</text>
<text class="on" x="545.0" y="158" font-size="12.5" text-anchor="middle">files every message;</text>
<text class="on" x="545.0" y="173" font-size="12.5" text-anchor="middle">worked in order</text>
<rect class="core" x="460" y="230" width="170" height="64" rx="10" stroke-width="2"/>
<text class="on" x="545.0" y="251" font-size="15" font-weight="700" text-anchor="middle">Hold item</text>
<text class="on" x="545.0" y="268" font-size="12.5" text-anchor="middle">expected: agentpace&#x27;s</text>
<text class="on" x="545.0" y="283" font-size="12.5" text-anchor="middle">P80 for this run</text>
<rect class="core" x="230" y="240" width="180" height="80" rx="10" stroke-width="2"/>
<text class="on" x="320.0" y="261" font-size="15" font-weight="700" text-anchor="middle">vigil keepalive</text>
<text class="on" x="320.0" y="278" font-size="12.5" text-anchor="middle">blocks until an event;</text>
<text class="on" x="320.0" y="293" font-size="12.5" text-anchor="middle">window follows the</text>
<text class="on" x="320.0" y="308" font-size="12.5" text-anchor="middle">cache time to live</text>
<rect class="judge" x="10" y="240" width="170" height="64" rx="10" stroke-width="2"/>
<text class="ink" x="95.0" y="261" font-size="15" font-weight="700" text-anchor="middle">Act on evidence</text>
<text class="muted" x="95.0" y="278" font-size="12.5" text-anchor="middle">what changed, and why</text>
<rect class="judge" x="460" y="370" width="170" height="64" rx="10" stroke-width="2"/>
<text class="ink" x="545.0" y="391" font-size="15" font-weight="700" text-anchor="middle">Overdue</text>
<text class="muted" x="545.0" y="408" font-size="12.5" text-anchor="middle">check or steer the run</text>
<rect class="judge" x="10" y="380" width="170" height="64" rx="10" stroke-width="2"/>
<text class="ink" x="95.0" y="401" font-size="15" font-weight="700" text-anchor="middle">Paused</text>
<text class="muted" x="95.0" y="418" font-size="12.5" text-anchor="middle">wait for the reset</text>
<rect class="chaos" x="10" y="490" width="170" height="34" rx="10" stroke-width="2" stroke-dasharray="6 4"/>
<text class="ink" x="95.0" y="512.0" font-size="15" font-weight="700" text-anchor="middle">A usage limit</text>
<rect class="judge" x="230" y="420" width="180" height="80" rx="10" stroke-width="2"/>
<text class="ink" x="320.0" y="441" font-size="15" font-weight="700" text-anchor="middle">Compact</text>
<text class="muted" x="320.0" y="458" font-size="12.5" text-anchor="middle">at a boundary I choose:</text>
<text class="muted" x="320.0" y="473" font-size="12.5" text-anchor="middle">BabelTele summary,</text>
<text class="muted" x="320.0" y="488" font-size="12.5" text-anchor="middle">reread skills</text>
<path class="in" d="M545 84 L545 116" stroke-width="2" marker-end="url(#hin)"/>
<path class="fw" d="M460 152 C430 152 420 100 414 92" stroke-width="2" marker-end="url(#hfw)"/>
<path class="fw" d="M410 98 C450 110 470 180 500 226" stroke-width="2" marker-end="url(#hfw)"/>
<text class="muted" x="470" y="214" font-size="11.5" text-anchor="end">dispatch</text>
<path class="fw" d="M460 270 L414 275" stroke-width="2" marker-end="url(#hfw)"/>
<path class="fw" d="M320 110 L320 236" stroke-width="2" marker-end="url(#hfw)"/>
<text class="muted" x="326" y="180" font-size="11.5" text-anchor="start">nothing to do</text>
<path class="fw" d="M230 280 L184 275" stroke-width="2" marker-end="url(#hfw)"/>
<text class="muted" x="207" y="266" font-size="11.5" text-anchor="middle">event</text>
<path class="bk" d="M95 240 C95 140 150 85 226 85" stroke-width="2" marker-end="url(#hbk)"/>
<text class="bkink" x="110" y="150" font-size="11.5" text-anchor="start">next step</text>
<path class="bk" d="M380 320 C400 360 360 362 345 324" stroke-width="2" marker-end="url(#hbk)"/>
<text class="bkink" x="398" y="360" font-size="11.5" text-anchor="start">window ends:</text>
<text class="bkink" x="398" y="374" font-size="11.5" text-anchor="start">call again</text>
<path class="fw" d="M410 300 C470 310 510 330 520 366" stroke-width="2" marker-end="url(#hfw)"/>
<text class="muted" x="522" y="350" font-size="11.5" text-anchor="start">past P80</text>
<path class="bk" d="M500 370 C470 340 440 320 414 312" stroke-width="2" marker-end="url(#hbk)"/>
<path class="in" d="M95 490 L95 448" stroke-width="2" marker-end="url(#hin)"/>
<path class="bk" d="M95 380 L95 308" stroke-width="2" marker-end="url(#hbk)"/>
<text class="bkink" x="101" y="350" font-size="11.5" text-anchor="start">reset</text>
<path class="fw" d="M320 320 L320 416" stroke-width="2" marker-end="url(#hfw)"/>
<text class="muted" x="326" y="400" font-size="11.5" text-anchor="start">context full</text>
<path class="bk" d="M230 430 C200 420 190 330 184 300" stroke-width="2" marker-end="url(#hbk)"/>
<text class="bkink" x="196" y="372" font-size="11.5" text-anchor="end">resume</text>
</svg>
