<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 600" width="100%" role="img" aria-labelledby="t d">
<title id="t">How the session waits</title>
<desc id="d">The orchestrator dispatches a run and adds it to a vigil hold, with agentpace P80 as its expected time, then calls keepalive, which blocks until the run ends or the window ends. When the run ends, the orchestrator acts on the evidence and dispatches the next. Past the P80 the run is overdue and the orchestrator checks on it. At any point: my messages go into workq, a usage limit pauses the session, and a full context is compacted.</desc>
<defs>
<marker id="hfw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hfw" d="M0 0 L10 5 L0 10 Z"/></marker>
<marker id="hbk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hbk" d="M0 0 L10 5 L0 10 Z"/></marker>
<marker id="hin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hin" d="M0 0 L10 5 L0 10 Z"/></marker>
</defs>
<style>
.judge{fill:#eaf2fd;stroke:#3a78c9} .core{fill:#1f6f43;stroke:#14512f} .chaos{fill:#fdf1e7;stroke:#d97a2b}
.ink{fill:#1f2328} .muted{fill:#4a525b} .on{fill:#ffffff} .git{fill:#8250df}
.fw{stroke:#57606a;fill:none} .bk{stroke:#3a78c9;fill:none} .in{stroke:#d97a2b;fill:none} .encl{stroke:#8c959f;fill:none}
.hfw{fill:#57606a} .hbk{fill:#3a78c9} .hin{fill:#d97a2b} .bkink{fill:#2f6db5} .grid{stroke:#d1d9e0}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme: dark){
.judge{fill:#12233a;stroke:#5b9be6} .core{fill:#2ea062;stroke:#7ee2a8} .chaos{fill:#2a1d12;stroke:#e08a3c}
.ink{fill:#f0f6fc} .muted{fill:#b1b8c0} .on{fill:#04150c} .git{fill:#c297ff}
.fw{stroke:#8b949e} .bk{stroke:#5b9be6} .in{stroke:#e08a3c} .encl{stroke:#6e7681}
.hfw{fill:#8b949e} .hbk{fill:#5b9be6} .hin{fill:#e08a3c} .bkink{fill:#7fb3f0} .grid{stroke:#30363d}
}
</style>
<rect class="chaos" x="8" y="8" width="22" height="14" rx="4" stroke-width="2" stroke-dasharray="4 3"/>
<text class="muted" x="36" y="20" font-size="12" text-anchor="start">me, or the world</text>
<rect class="judge" x="150" y="8" width="22" height="14" rx="4" stroke-width="2"/>
<text class="muted" x="178" y="20" font-size="12" text-anchor="start">an agent decides</text>
<rect class="core" x="292" y="8" width="22" height="14" rx="4" stroke-width="2"/>
<text class="muted" x="320" y="20" font-size="12" text-anchor="start">a program decides</text>
<text class="git mono" x="440" y="20" font-size="12" text-anchor="start">git</text>
<line class="bk" x1="470" y1="16" x2="500" y2="16" stroke-width="2"/>
<text class="muted" x="506" y="20" font-size="12" text-anchor="start">back edge</text>
<text class="ink" x="127" y="64" font-size="15" text-anchor="middle" font-weight="700">Orchestrator</text>
<text class="ink" x="320" y="64" font-size="15" text-anchor="middle" font-weight="700">vigil</text>
<text class="ink" x="529" y="64" font-size="15" text-anchor="middle" font-weight="700">The run</text>
<rect class="judge" x="44" y="80" width="166" height="64" rx="10" stroke-width="2"/>
<text class="ink" x="127.0" y="101" font-size="15" font-weight="700" text-anchor="middle">Dispatch a run</text>
<text class="muted" x="127.0" y="118" font-size="12.5" text-anchor="middle">to Sol, Sonnet or</text>
<text class="muted" x="127.0" y="133" font-size="12.5" text-anchor="middle">another model</text>
<rect class="core" x="232" y="80" width="176" height="64" rx="10" stroke-width="2"/>
<text class="on" x="320.0" y="101" font-size="15" font-weight="700" text-anchor="middle">Hold item</text>
<text class="on" x="320.0" y="118" font-size="12.5" text-anchor="middle">expected time:</text>
<text class="on" x="320.0" y="133" font-size="12.5" text-anchor="middle">agentpace&#x27;s P80</text>
<rect class="judge" x="446" y="80" width="166" height="64" rx="10" stroke-width="2"/>
<text class="ink" x="529.0" y="101" font-size="15" font-weight="700" text-anchor="middle">Run works</text>
<text class="muted" x="529.0" y="118" font-size="12.5" text-anchor="middle">writes its report</text>
<text class="muted" x="529.0" y="133" font-size="12.5" text-anchor="middle">early and keeps it</text>
<rect class="judge" x="44" y="200" width="166" height="64" rx="10" stroke-width="2"/>
<text class="ink" x="127.0" y="221" font-size="15" font-weight="700" text-anchor="middle">Call keepalive</text>
<text class="muted" x="127.0" y="238" font-size="12.5" text-anchor="middle">then wait</text>
<rect class="core" x="232" y="192" width="176" height="80" rx="10" stroke-width="2"/>
<text class="on" x="320.0" y="213" font-size="15" font-weight="700" text-anchor="middle">keepalive blocks</text>
<text class="on" x="320.0" y="230" font-size="12.5" text-anchor="middle">until an event; the</text>
<text class="on" x="320.0" y="245" font-size="12.5" text-anchor="middle">window follows the</text>
<text class="on" x="320.0" y="260" font-size="12.5" text-anchor="middle">cache time to live</text>
<rect class="judge" x="44" y="330" width="166" height="64" rx="10" stroke-width="2"/>
<text class="ink" x="127.0" y="351" font-size="15" font-weight="700" text-anchor="middle">Act on evidence</text>
<text class="muted" x="127.0" y="368" font-size="12.5" text-anchor="middle">what changed, and</text>
<text class="muted" x="127.0" y="383" font-size="12.5" text-anchor="middle">what it means</text>
<rect class="judge" x="446" y="330" width="166" height="64" rx="10" stroke-width="2"/>
<text class="ink" x="529.0" y="351" font-size="15" font-weight="700" text-anchor="middle">Overdue</text>
<text class="muted" x="529.0" y="368" font-size="12.5" text-anchor="middle">the orchestrator</text>
<text class="muted" x="529.0" y="383" font-size="12.5" text-anchor="middle">checks or steers it</text>
<path class="fw" d="M210 112 L228 112" stroke-width="2" marker-end="url(#hfw)"/>
<path class="fw" d="M408 112 L442 112" stroke-width="2" stroke-dasharray="4 4"/>
<path class="fw" d="M127 144 L127 196" stroke-width="2" marker-end="url(#hfw)"/>
<path class="fw" d="M210 232 L228 232" stroke-width="2" marker-end="url(#hfw)"/>
<path class="fw" d="M480 144 C470 180 440 200 412 212" stroke-width="2" marker-end="url(#hfw)"/>
<text class="muted" x="474" y="186" font-size="11.5" text-anchor="start">run ends</text>
<path class="bk" d="M408 240 C452 240 452 266 412 266" stroke-width="2" marker-end="url(#hbk)"/>
<text class="bkink" x="458" y="252" font-size="11.5" text-anchor="start">window ends:</text>
<text class="bkink" x="458" y="266" font-size="11.5" text-anchor="start">block again</text>
<path class="fw" d="M250 272 C240 300 220 320 212 336" stroke-width="2" marker-end="url(#hfw)"/>
<text class="muted" x="242" y="316" font-size="11.5" text-anchor="start">wakes with</text>
<text class="muted" x="242" y="330" font-size="11.5" text-anchor="start">the evidence</text>
<path class="fw" d="M400 272 C420 300 450 315 470 326" stroke-width="2" marker-end="url(#hfw)"/>
<text class="muted" x="424" y="322" font-size="11.5" text-anchor="end">past P80</text>
<path class="bk" d="M600 330 L600 148" stroke-width="2" marker-end="url(#hbk)"/>
<text class="bkink" x="594" y="240" font-size="11.5" text-anchor="end">steered</text>
<path class="bk" d="M44 362 C8 362 8 112 40 112" stroke-width="2" marker-end="url(#hbk)"/>
<text class="bkink" x="34" y="236" font-size="11.5" text-anchor="middle" transform="rotate(-90 34 236)">next run</text>
<text class="ink" x="325" y="440" font-size="15" text-anchor="middle" font-weight="700">At any point</text>
<rect class="chaos" x="20" y="456" width="190" height="34" rx="10" stroke-width="2" stroke-dasharray="6 4"/>
<text class="ink" x="115.0" y="478.0" font-size="15" font-weight="700" text-anchor="middle">My message</text>
<path class="in" d="M115 490 L115 516" stroke-width="2" marker-end="url(#hin)"/>
<rect class="core" x="20" y="520" width="190" height="64" rx="10" stroke-width="2"/>
<text class="on" x="115.0" y="541" font-size="15" font-weight="700" text-anchor="middle">workq</text>
<text class="on" x="115.0" y="558" font-size="12.5" text-anchor="middle">files it; worked</text>
<text class="on" x="115.0" y="573" font-size="12.5" text-anchor="middle">in order</text>
<rect class="chaos" x="230" y="456" width="190" height="34" rx="10" stroke-width="2" stroke-dasharray="6 4"/>
<text class="ink" x="325.0" y="478.0" font-size="15" font-weight="700" text-anchor="middle">A usage limit</text>
<path class="in" d="M325 490 L325 516" stroke-width="2" marker-end="url(#hin)"/>
<rect class="judge" x="230" y="520" width="190" height="64" rx="10" stroke-width="2"/>
<text class="ink" x="325.0" y="541" font-size="15" font-weight="700" text-anchor="middle">Paused</text>
<text class="muted" x="325.0" y="558" font-size="12.5" text-anchor="middle">wait for the reset,</text>
<text class="muted" x="325.0" y="573" font-size="12.5" text-anchor="middle">resume in place</text>
<rect class="chaos" x="440" y="456" width="190" height="34" rx="10" stroke-width="2" stroke-dasharray="6 4"/>
<text class="ink" x="535.0" y="478.0" font-size="15" font-weight="700" text-anchor="middle">Context nearly full</text>
<path class="in" d="M535 490 L535 516" stroke-width="2" marker-end="url(#hin)"/>
<rect class="judge" x="440" y="520" width="190" height="64" rx="10" stroke-width="2"/>
<text class="ink" x="535.0" y="541" font-size="15" font-weight="700" text-anchor="middle">Compact</text>
<text class="muted" x="535.0" y="558" font-size="12.5" text-anchor="middle">at a boundary; BabelTele</text>
<text class="muted" x="535.0" y="573" font-size="12.5" text-anchor="middle">summary, reread skills</text>
</svg>
