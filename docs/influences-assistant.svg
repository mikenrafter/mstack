<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="100%" role="img" aria-labelledby="t d">
<title id="t">What shape an assistant takes</title>
<desc id="d">A scale from person-shaped to tool-shaped. At the person-shaped end, a buddy with personality and memory, as Miessler proposes. In the middle, a persona used as a lens to steer a model. At the tool-shaped end, infrastructure with buttons and predictable behavior, which is what I want, with memory as a means.</desc>
<defs>
<marker id="hfw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hfw" d="M0 0 L10 5 L0 10 Z"/></marker>
<marker id="hbk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hbk" d="M0 0 L10 5 L0 10 Z"/></marker>
<marker id="hin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hin" d="M0 0 L10 5 L0 10 Z"/></marker>
</defs>
<style>
.judge{fill:#eaf2fd;stroke:#3a78c9} .core{fill:#1f6f43;stroke:#14512f} .chaos{fill:#fdf1e7;stroke:#d97a2b}
.ink{fill:#1f2328} .muted{fill:#4a525b} .on{fill:#ffffff} .git{fill:#8250df}
.fw{stroke:#57606a;fill:none} .bk{stroke:#3a78c9;fill:none} .in{stroke:#d97a2b;fill:none} .encl{stroke:#8c959f;fill:none}
.hfw{fill:#57606a} .hbk{fill:#3a78c9} .hin{fill:#d97a2b} .bkink{fill:#2f6db5} .grid{stroke:#d1d9e0}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme: dark){
.judge{fill:#12233a;stroke:#5b9be6} .core{fill:#2ea062;stroke:#7ee2a8} .chaos{fill:#2a1d12;stroke:#e08a3c}
.ink{fill:#f0f6fc} .muted{fill:#b1b8c0} .on{fill:#04150c} .git{fill:#c297ff}
.fw{stroke:#8b949e} .bk{stroke:#5b9be6} .in{stroke:#e08a3c} .encl{stroke:#6e7681}
.hfw{fill:#8b949e} .hbk{fill:#5b9be6} .hin{fill:#e08a3c} .bkink{fill:#7fb3f0} .grid{stroke:#30363d}
}
</style>
<rect class="chaos" x="8" y="8" width="22" height="14" rx="4" stroke-width="2" stroke-dasharray="4 3"/>
<text class="muted" x="36" y="20" font-size="12" text-anchor="start">me, or the world</text>
<rect class="judge" x="160" y="8" width="22" height="14" rx="4" stroke-width="2"/>
<text class="muted" x="188" y="20" font-size="12" text-anchor="start">a mind decides (person or agent)</text>
<rect class="core" x="390" y="8" width="22" height="14" rx="4" stroke-width="2"/>
<text class="muted" x="418" y="20" font-size="12" text-anchor="start">a program or structure holds it</text>
<rect class="judge" x="8" y="60" width="180" height="90" rx="10" stroke-width="2"/>
<text class="ink" x="98.0" y="81" font-size="15" font-weight="700" text-anchor="middle">A buddy</text>
<text class="muted" x="98.0" y="98" font-size="12.5" text-anchor="middle">personality and memory</text>
<text class="muted" x="98.0" y="113" font-size="12.5" text-anchor="middle">Miessler</text>
<rect class="judge" x="230" y="60" width="180" height="90" rx="10" stroke-width="2" stroke-dasharray="6 4"/>
<text class="ink" x="320.0" y="81" font-size="15" font-weight="700" text-anchor="middle">A persona</text>
<text class="muted" x="320.0" y="98" font-size="12.5" text-anchor="middle">a caricature that steers</text>
<text class="muted" x="320.0" y="113" font-size="12.5" text-anchor="middle">the model&#x27;s distribution</text>
<rect class="core" x="452" y="60" width="180" height="90" rx="10" stroke-width="2"/>
<text class="on" x="542.0" y="81" font-size="15" font-weight="700" text-anchor="middle">Infrastructure</text>
<text class="on" x="542.0" y="98" font-size="12.5" text-anchor="middle">buttons, predictable behavior</text>
<text class="on" x="542.0" y="113" font-size="12.5" text-anchor="middle">memory as a means</text>
<text class="on" x="542.0" y="128" font-size="12.5" text-anchor="middle">what I want</text>
<path class="fw" d="M60 196 L580 196" stroke-width="2" marker-end="url(#hfw)"/>
<path class="fw" d="M580 196 L60 196" stroke-width="2" marker-end="url(#hfw)"/>
<text class="muted" x="60" y="222" font-size="12.5" text-anchor="start">person-shaped</text>
<text class="muted" x="580" y="222" font-size="12.5" text-anchor="end">tool-shaped</text>
</svg>
