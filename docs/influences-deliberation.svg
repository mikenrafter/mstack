<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="100%" role="img" aria-labelledby="t d">
<title id="t">Deliberation, not a locked stance</title>
<desc id="d">One model alone grows more confident in its first stance whatever it reads. Instead, agents each argue an assigned stance, a program records the arguments, and I weigh them against my values. The build loop review rounds work this way.</desc>
<defs>
<marker id="hfw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hfw" d="M0 0 L10 5 L0 10 Z"/></marker>
<marker id="hbk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hbk" d="M0 0 L10 5 L0 10 Z"/></marker>
<marker id="hin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hin" d="M0 0 L10 5 L0 10 Z"/></marker>
</defs>
<style>
.judge{fill:#eaf2fd;stroke:#3a78c9} .core{fill:#1f6f43;stroke:#14512f} .chaos{fill:#fdf1e7;stroke:#d97a2b}
.ink{fill:#1f2328} .muted{fill:#4a525b} .on{fill:#ffffff} .git{fill:#8250df}
.fw{stroke:#57606a;fill:none} .bk{stroke:#3a78c9;fill:none} .in{stroke:#d97a2b;fill:none} .encl{stroke:#8c959f;fill:none}
.hfw{fill:#57606a} .hbk{fill:#3a78c9} .hin{fill:#d97a2b} .bkink{fill:#2f6db5} .grid{stroke:#d1d9e0}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme: dark){
.judge{fill:#12233a;stroke:#5b9be6} .core{fill:#2ea062;stroke:#7ee2a8} .chaos{fill:#2a1d12;stroke:#e08a3c}
.ink{fill:#f0f6fc} .muted{fill:#b1b8c0} .on{fill:#04150c} .git{fill:#c297ff}
.fw{stroke:#8b949e} .bk{stroke:#5b9be6} .in{stroke:#e08a3c} .encl{stroke:#6e7681}
.hfw{fill:#8b949e} .hbk{fill:#5b9be6} .hin{fill:#e08a3c} .bkink{fill:#7fb3f0} .grid{stroke:#30363d}
}
</style>
<rect class="chaos" x="8" y="8" width="22" height="14" rx="4" stroke-width="2" stroke-dasharray="4 3"/>
<text class="muted" x="36" y="20" font-size="12" text-anchor="start">me, or the world</text>
<rect class="judge" x="160" y="8" width="22" height="14" rx="4" stroke-width="2"/>
<text class="muted" x="188" y="20" font-size="12" text-anchor="start">a mind decides (person or agent)</text>
<rect class="core" x="390" y="8" width="22" height="14" rx="4" stroke-width="2"/>
<text class="muted" x="418" y="20" font-size="12" text-anchor="start">a program or structure holds it</text>
<text class="ink" x="8" y="62" font-size="13" text-anchor="start" font-weight="700">One model alone</text>
<rect class="judge" x="8" y="72" width="190" height="60" rx="10" stroke-width="2"/>
<text class="ink" x="103.0" y="93" font-size="15" font-weight="700" text-anchor="middle">First stance</text>
<text class="muted" x="103.0" y="110" font-size="12.5" text-anchor="middle">Coleman</text>
<rect class="judge" x="240" y="72" width="250" height="60" rx="10" stroke-width="2" stroke-dasharray="6 4"/>
<text class="ink" x="365.0" y="93" font-size="15" font-weight="700" text-anchor="middle">Grows more confident</text>
<text class="muted" x="365.0" y="110" font-size="12.5" text-anchor="middle">whatever it reads</text>
<path class="fw" d="M198 102 L236 102" stroke-width="2" marker-end="url(#hfw)"/>
<text class="ink" x="8" y="172" font-size="13" text-anchor="start" font-weight="700">Assigned stances</text>
<rect class="judge" x="8" y="182" width="150" height="50" rx="10" stroke-width="2"/>
<text class="ink" x="83.0" y="212.0" font-size="15" font-weight="700" text-anchor="middle">Agent: for</text>
<rect class="judge" x="8" y="250" width="150" height="50" rx="10" stroke-width="2"/>
<text class="ink" x="83.0" y="280.0" font-size="15" font-weight="700" text-anchor="middle">Agent: against</text>
<rect class="core" x="210" y="200" width="180" height="84" rx="10" stroke-width="2"/>
<text class="on" x="300.0" y="221" font-size="15" font-weight="700" text-anchor="middle">Ledger</text>
<text class="on" x="300.0" y="238" font-size="12.5" text-anchor="middle">every argument and</text>
<text class="on" x="300.0" y="253" font-size="12.5" text-anchor="middle">its answer, recorded</text>
<text class="on" x="300.0" y="268" font-size="12.5" text-anchor="middle">review-ledger</text>
<rect class="chaos" x="442" y="200" width="190" height="84" rx="10" stroke-width="2" stroke-dasharray="6 4"/>
<text class="ink" x="537.0" y="221" font-size="15" font-weight="700" text-anchor="middle">I weigh them</text>
<text class="muted" x="537.0" y="238" font-size="12.5" text-anchor="middle">against my values</text>
<text class="muted" x="537.0" y="253" font-size="12.5" text-anchor="middle">Bumpers: many catches</text>
<path class="fw" d="M158 207 L206 230" stroke-width="2" marker-end="url(#hfw)"/>
<path class="fw" d="M158 275 L206 254" stroke-width="2" marker-end="url(#hfw)"/>
<path class="fw" d="M390 242 L438 242" stroke-width="2" marker-end="url(#hfw)"/>
</svg>
