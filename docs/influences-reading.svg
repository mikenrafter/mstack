<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="100%" role="img" aria-labelledby="t d">
<title id="t">From reading to building</title>
<desc id="d">I read widely. Readwise and Reader hold the highlights and my notes, and schedule review. Ideas become main notes and then skills and tools. Tasks never enter the notes; they go to workq.</desc>
<defs>
<marker id="hfw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hfw" d="M0 0 L10 5 L0 10 Z"/></marker>
<marker id="hbk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hbk" d="M0 0 L10 5 L0 10 Z"/></marker>
<marker id="hin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hin" d="M0 0 L10 5 L0 10 Z"/></marker>
</defs>
<style>
.judge{fill:#eaf2fd;stroke:#3a78c9} .core{fill:#1f6f43;stroke:#14512f} .chaos{fill:#fdf1e7;stroke:#d97a2b}
.ink{fill:#1f2328} .muted{fill:#4a525b} .on{fill:#ffffff} .git{fill:#8250df}
.fw{stroke:#57606a;fill:none} .bk{stroke:#3a78c9;fill:none} .in{stroke:#d97a2b;fill:none} .encl{stroke:#8c959f;fill:none}
.hfw{fill:#57606a} .hbk{fill:#3a78c9} .hin{fill:#d97a2b} .bkink{fill:#2f6db5} .grid{stroke:#d1d9e0}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme: dark){
.judge{fill:#12233a;stroke:#5b9be6} .core{fill:#2ea062;stroke:#7ee2a8} .chaos{fill:#2a1d12;stroke:#e08a3c}
.ink{fill:#f0f6fc} .muted{fill:#b1b8c0} .on{fill:#04150c} .git{fill:#c297ff}
.fw{stroke:#8b949e} .bk{stroke:#5b9be6} .in{stroke:#e08a3c} .encl{stroke:#6e7681}
.hfw{fill:#8b949e} .hbk{fill:#5b9be6} .hin{fill:#e08a3c} .bkink{fill:#7fb3f0} .grid{stroke:#30363d}
}
</style>
<rect class="chaos" x="8" y="8" width="22" height="14" rx="4" stroke-width="2" stroke-dasharray="4 3"/>
<text class="muted" x="36" y="20" font-size="12" text-anchor="start">me, or what I read</text>
<rect class="judge" x="160" y="8" width="22" height="14" rx="4" stroke-width="2"/>
<text class="muted" x="188" y="20" font-size="12" text-anchor="start">a mind decides (person or agent)</text>
<rect class="core" x="390" y="8" width="22" height="14" rx="4" stroke-width="2"/>
<text class="muted" x="418" y="20" font-size="12" text-anchor="start">a program or structure holds it</text>
<rect class="chaos" x="8" y="120" width="150" height="80" rx="10" stroke-width="2" stroke-dasharray="6 4"/>
<text class="ink" x="83.0" y="141" font-size="15" font-weight="700" text-anchor="middle">Read widely</text>
<text class="muted" x="83.0" y="158" font-size="12.5" text-anchor="middle">books, papers, talks</text>
<text class="muted" x="83.0" y="173" font-size="12.5" text-anchor="middle">Ahmed, Rinko</text>
<rect class="core" x="190" y="120" width="160" height="80" rx="10" stroke-width="2"/>
<text class="on" x="270.0" y="141" font-size="15" font-weight="700" text-anchor="middle">Highlight, note</text>
<text class="on" x="270.0" y="158" font-size="12.5" text-anchor="middle">Readwise and Reader</text>
<text class="on" x="270.0" y="173" font-size="12.5" text-anchor="middle">SuperMemo: small portions</text>
<rect class="judge" x="384" y="50" width="120" height="70" rx="10" stroke-width="2"/>
<text class="ink" x="444.0" y="71" font-size="15" font-weight="700" text-anchor="middle">Main notes</text>
<text class="muted" x="444.0" y="88" font-size="12.5" text-anchor="middle">ideas, linked</text>
<text class="muted" x="444.0" y="103" font-size="12.5" text-anchor="middle">Doto</text>
<rect class="core" x="384" y="210" width="120" height="70" rx="10" stroke-width="2"/>
<text class="on" x="444.0" y="231" font-size="15" font-weight="700" text-anchor="middle">workq</text>
<text class="on" x="444.0" y="248" font-size="12.5" text-anchor="middle">tasks only</text>
<text class="on" x="444.0" y="263" font-size="12.5" text-anchor="middle">Doto: tasks are not ideas</text>
<rect class="core" x="530" y="50" width="102" height="70" rx="10" stroke-width="2"/>
<text class="on" x="581.0" y="71" font-size="15" font-weight="700" text-anchor="middle">Tools</text>
<text class="on" x="581.0" y="88" font-size="12.5" text-anchor="middle">mstack, vigil</text>
<text class="on" x="581.0" y="103" font-size="12.5" text-anchor="middle">residual</text>
<path class="fw" d="M158 160 L186 160" stroke-width="2" marker-end="url(#hfw)"/>
<path class="fw" d="M350 145 L380 95" stroke-width="2" marker-end="url(#hfw)"/>
<path class="fw" d="M350 175 L380 240" stroke-width="2" marker-end="url(#hfw)"/>
<path class="fw" d="M504 85 L526 85" stroke-width="2" marker-end="url(#hfw)"/>
<path class="bk" d="M270 200 C270 300 120 300 90 204" stroke-width="2" marker-end="url(#hbk)"/>
<text class="bkink" x="180" y="300" font-size="12.5" text-anchor="middle">spaced review</text>
</svg>
