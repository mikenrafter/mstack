<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 610" width="100%" role="img" aria-labelledby="t d">
<title id="t">A review round</title>
<desc id="d">Three columns, as in the slice diagram. The reviewer, a model that wrote none of the code, reviews one diff and sends findings and scores. The orchestrator pushes back on a finding; the reviewer keeps, changes or drops it, and they go round until it is settled (at least once, twice with Fable). review-ledger then scores each concern against its bar. At the bar: checkpoint. Below it: the other model fixes it, failing test first, and the next round starts. Below it after round 3: Fable steps back and names a pivot. Below it after round 5: I decide.</desc>
<defs>
<marker id="hfw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hfw" d="M0 0 L10 5 L0 10 Z"/></marker>
<marker id="hbk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hbk" d="M0 0 L10 5 L0 10 Z"/></marker>
<marker id="hin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hin" d="M0 0 L10 5 L0 10 Z"/></marker>
</defs>
<style>
.judge{fill:#eaf2fd;stroke:#3a78c9} .core{fill:#1f6f43;stroke:#14512f} .chaos{fill:#fdf1e7;stroke:#d97a2b}
.ink{fill:#1f2328} .muted{fill:#4a525b} .on{fill:#ffffff} .git{fill:#8250df}
.fw{stroke:#57606a;fill:none} .bk{stroke:#3a78c9;fill:none} .in{stroke:#d97a2b;fill:none} .encl{stroke:#8c959f;fill:none}
.hfw{fill:#57606a} .hbk{fill:#3a78c9} .hin{fill:#d97a2b} .bkink{fill:#2f6db5} .grid{stroke:#d1d9e0}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme: dark){
.judge{fill:#12233a;stroke:#5b9be6} .core{fill:#2ea062;stroke:#7ee2a8} .chaos{fill:#2a1d12;stroke:#e08a3c}
.ink{fill:#f0f6fc} .muted{fill:#b1b8c0} .on{fill:#04150c} .git{fill:#c297ff}
.fw{stroke:#8b949e} .bk{stroke:#5b9be6} .in{stroke:#e08a3c} .encl{stroke:#6e7681}
.hfw{fill:#8b949e} .hbk{fill:#5b9be6} .hin{fill:#e08a3c} .bkink{fill:#7fb3f0} .grid{stroke:#30363d}
}
</style>
<rect class="chaos" x="8" y="8" width="22" height="14" rx="4" stroke-width="2" stroke-dasharray="4 3"/>
<text class="muted" x="36" y="20" font-size="12" text-anchor="start">me, or the world</text>
<rect class="judge" x="150" y="8" width="22" height="14" rx="4" stroke-width="2"/>
<text class="muted" x="178" y="20" font-size="12" text-anchor="start">an agent decides</text>
<rect class="core" x="292" y="8" width="22" height="14" rx="4" stroke-width="2"/>
<text class="muted" x="320" y="20" font-size="12" text-anchor="start">a program decides</text>
<text class="git mono" x="440" y="20" font-size="12" text-anchor="start">git</text>
<line class="bk" x1="470" y1="16" x2="500" y2="16" stroke-width="2"/>
<text class="muted" x="506" y="20" font-size="12" text-anchor="start">back edge</text>
<path class="bk" d="M612 452 C650 452 650 44 560 44 L170 44 C140 44 127 56 127 80" stroke-width="2" marker-end="url(#hbk)"/>
<text class="bkink" x="330" y="40" font-size="11.5" text-anchor="middle">next round</text>
<text class="ink" x="127" y="70" font-size="15" text-anchor="middle" font-weight="700">Reviewer</text>
<text class="ink" x="320" y="70" font-size="15" text-anchor="middle" font-weight="700">Programs</text>
<text class="ink" x="529" y="70" font-size="15" text-anchor="middle" font-weight="700">Orchestrator</text>
<rect class="judge" x="44" y="84" width="166" height="64" rx="10" stroke-width="2"/>
<text class="ink" x="127.0" y="105" font-size="15" font-weight="700" text-anchor="middle">Review round k</text>
<text class="muted" x="127.0" y="122" font-size="12.5" text-anchor="middle">wrote none of the code</text>
<text class="git mono" x="127.0" y="137" font-size="11.5" text-anchor="middle">one diff since the base</text>
<rect class="judge" x="446" y="84" width="166" height="64" rx="10" stroke-width="2"/>
<text class="ink" x="529.0" y="105" font-size="15" font-weight="700" text-anchor="middle">Push back</text>
<text class="muted" x="529.0" y="122" font-size="12.5" text-anchor="middle">challenge one finding</text>
<text class="muted" x="529.0" y="137" font-size="12.5" text-anchor="middle">or its assumption</text>
<rect class="judge" x="44" y="210" width="166" height="64" rx="10" stroke-width="2"/>
<text class="ink" x="127.0" y="231" font-size="15" font-weight="700" text-anchor="middle">Answer</text>
<text class="muted" x="127.0" y="248" font-size="12.5" text-anchor="middle">keep, change or drop</text>
<text class="muted" x="127.0" y="263" font-size="12.5" text-anchor="middle">the finding</text>
<rect class="core" x="232" y="300" width="176" height="80" rx="10" stroke-width="2"/>
<text class="on" x="320.0" y="321" font-size="15" font-weight="700" text-anchor="middle">review-ledger</text>
<text class="on" x="320.0" y="338" font-size="12.5" text-anchor="middle">scores each concern</text>
<text class="on" x="320.0" y="353" font-size="12.5" text-anchor="middle">against its bar;</text>
<text class="on" x="320.0" y="368" font-size="12.5" text-anchor="middle">prints the next step</text>
<rect class="judge" x="446" y="308" width="166" height="64" rx="10" stroke-width="2"/>
<text class="ink" x="529.0" y="329" font-size="15" font-weight="700" text-anchor="middle">Checkpoint</text>
<text class="muted" x="529.0" y="346" font-size="12.5" text-anchor="middle">cull nits, keep fixes;</text>
<text class="muted" x="529.0" y="361" font-size="12.5" text-anchor="middle">tier 2 or ship</text>
<rect class="judge" x="446" y="420" width="166" height="64" rx="10" stroke-width="2"/>
<text class="ink" x="529.0" y="441" font-size="15" font-weight="700" text-anchor="middle">Fix</text>
<text class="muted" x="529.0" y="458" font-size="12.5" text-anchor="middle">the model that didn&#x27;t</text>
<text class="git mono" x="529.0" y="473" font-size="11.5" text-anchor="middle">failing test first</text>
<rect class="judge" x="44" y="420" width="166" height="64" rx="10" stroke-width="2"/>
<text class="ink" x="127.0" y="441" font-size="15" font-weight="700" text-anchor="middle">Fable steps back</text>
<text class="muted" x="127.0" y="458" font-size="12.5" text-anchor="middle">what should we</text>
<text class="muted" x="127.0" y="473" font-size="12.5" text-anchor="middle">pivot to instead?</text>
<rect class="chaos" x="232" y="500" width="176" height="44" rx="10" stroke-width="2" stroke-dasharray="6 4"/>
<text class="ink" x="320.0" y="527.0" font-size="15" font-weight="700" text-anchor="middle">Stuck: I decide</text>
<path class="fw" d="M210 110 L442 110" stroke-width="2" marker-end="url(#hfw)"/>
<text class="muted" x="326" y="102" font-size="11.5" text-anchor="middle">findings and scores</text>
<path class="fw" d="M470 148 C430 190 260 190 214 224" stroke-width="2" marker-end="url(#hfw)"/>
<text class="muted" x="326" y="178" font-size="11.5" text-anchor="middle">objection</text>
<path class="bk" d="M210 252 C300 250 470 230 500 152" stroke-width="2" marker-end="url(#hbk)"/>
<text class="bkink" x="330" y="262" font-size="11.5" text-anchor="middle">answer; again until settled</text>
<text class="bkink" x="326" y="276" font-size="11.5" text-anchor="middle">(Fable: at least twice)</text>
<path class="fw" d="M590 148 C600 220 470 290 412 318" stroke-width="2" marker-end="url(#hfw)"/>
<text class="muted" x="560" y="262" font-size="11.5" text-anchor="start">settled</text>
<path class="fw" d="M408 340 L442 340" stroke-width="2" marker-end="url(#hfw)"/>
<text class="muted" x="426" y="334" font-size="11.5" text-anchor="middle">at bar</text>
<path class="fw" d="M408 370 C425 390 430 420 442 440" stroke-width="2" marker-end="url(#hfw)"/>
<text class="muted" x="418" y="410" font-size="11.5" text-anchor="end">below</text>
<path class="fw" d="M240 372 C225 390 215 410 212 424" stroke-width="2" marker-end="url(#hfw)"/>
<text class="muted" x="206" y="396" font-size="11.5" text-anchor="end">round 3 below</text>
<path class="fw" d="M320 380 L320 496" stroke-width="2" marker-end="url(#hfw)"/>
<text class="muted" x="326" y="470" font-size="11.5" text-anchor="start">round 5 below</text>
<path class="bk" d="M127 484 C127 600 529 600 529 488" stroke-width="2" marker-end="url(#hbk)"/>
<text class="bkink" x="330" y="592" font-size="11.5" text-anchor="middle">new approach</text>
</svg>
