<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 220" width="100%" role="img" aria-labelledby="t d">
<title id="t">How predictable is it?</title>
<desc id="d">A scale from more to less predictable. A program comes closest to ergodic. Then a codebase and its team, a person, a society, and the weather, which is never a closed system.</desc>
<defs>
<marker id="hfw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hfw" d="M0 0 L10 5 L0 10 Z"/></marker>
<marker id="hbk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hbk" d="M0 0 L10 5 L0 10 Z"/></marker>
<marker id="hin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hin" d="M0 0 L10 5 L0 10 Z"/></marker>
</defs>
<style>
.judge{fill:#eaf2fd;stroke:#3a78c9} .core{fill:#1f6f43;stroke:#14512f} .chaos{fill:#fdf1e7;stroke:#d97a2b}
.ink{fill:#1f2328} .muted{fill:#4a525b} .on{fill:#ffffff} .git{fill:#8250df}
.fw{stroke:#57606a;fill:none} .bk{stroke:#3a78c9;fill:none} .in{stroke:#d97a2b;fill:none} .encl{stroke:#8c959f;fill:none}
.hfw{fill:#57606a} .hbk{fill:#3a78c9} .hin{fill:#d97a2b} .bkink{fill:#2f6db5} .grid{stroke:#d1d9e0}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme: dark){
.judge{fill:#12233a;stroke:#5b9be6} .core{fill:#2ea062;stroke:#7ee2a8} .chaos{fill:#2a1d12;stroke:#e08a3c}
.ink{fill:#f0f6fc} .muted{fill:#b1b8c0} .on{fill:#04150c} .git{fill:#c297ff}
.fw{stroke:#8b949e} .bk{stroke:#5b9be6} .in{stroke:#e08a3c} .encl{stroke:#6e7681}
.hfw{fill:#8b949e} .hbk{fill:#5b9be6} .hin{fill:#e08a3c} .bkink{fill:#7fb3f0} .grid{stroke:#30363d}
}
</style>
<rect class="chaos" x="8" y="8" width="22" height="14" rx="4" stroke-width="2" stroke-dasharray="4 3"/>
<text class="muted" x="36" y="20" font-size="12" text-anchor="start">me, or the world</text>
<rect class="judge" x="160" y="8" width="22" height="14" rx="4" stroke-width="2"/>
<text class="muted" x="188" y="20" font-size="12" text-anchor="start">a mind decides (person or agent)</text>
<rect class="core" x="390" y="8" width="22" height="14" rx="4" stroke-width="2"/>
<text class="muted" x="418" y="20" font-size="12" text-anchor="start">a program or structure holds it</text>
<rect class="core" x="8" y="50" width="132" height="86" rx="10" stroke-width="2"/>
<text class="on" x="74.0" y="71" font-size="15" font-weight="700" text-anchor="middle">A program</text>
<text class="on" x="74.0" y="88" font-size="12.5" text-anchor="middle">closest to ergodic</text>
<text class="on" x="74.0" y="103" font-size="12.5" text-anchor="middle">Zhang et al.</text>
<rect class="judge" x="146" y="50" width="132" height="86" rx="10" stroke-width="2"/>
<text class="ink" x="212.0" y="71" font-size="15" font-weight="700" text-anchor="middle">A team</text>
<text class="muted" x="212.0" y="88" font-size="12.5" text-anchor="middle">find the constraint</text>
<text class="muted" x="212.0" y="103" font-size="12.5" text-anchor="middle">Woudenberg</text>
<rect class="judge" x="284" y="50" width="132" height="86" rx="10" stroke-width="2"/>
<text class="ink" x="350.0" y="71" font-size="15" font-weight="700" text-anchor="middle">A person</text>
<text class="muted" x="350.0" y="88" font-size="12.5" text-anchor="middle">residues for oneself</text>
<text class="muted" x="350.0" y="103" font-size="12.5" text-anchor="middle">Willison, Hall</text>
<rect class="judge" x="422" y="50" width="132" height="86" rx="10" stroke-width="2"/>
<text class="ink" x="488.0" y="71" font-size="15" font-weight="700" text-anchor="middle">A society</text>
<text class="muted" x="488.0" y="88" font-size="12.5" text-anchor="middle">equilibria drift</text>
<text class="muted" x="488.0" y="103" font-size="12.5" text-anchor="middle">Ober, Perez, Wilde</text>
<rect class="chaos" x="560" y="50" width="132" height="86" rx="10" stroke-width="2" stroke-dasharray="6 4"/>
<text class="ink" x="626.0" y="71" font-size="15" font-weight="700" text-anchor="middle">The weather</text>
<text class="muted" x="626.0" y="88" font-size="12.5" text-anchor="middle">never a closed system</text>
<text class="muted" x="626.0" y="103" font-size="12.5" text-anchor="middle">Zhang et al.</text>
<path class="fw" d="M40 180 L660 180" stroke-width="2" marker-end="url(#hfw)"/>
<path class="fw" d="M660 180 L40 180" stroke-width="2" marker-end="url(#hfw)"/>
<text class="muted" x="40" y="204" font-size="12.5" text-anchor="start">more predictable</text>
<text class="muted" x="660" y="204" font-size="12.5" text-anchor="end">less predictable</text>
</svg>
