<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="100%" role="img" aria-labelledby="t d">
<title id="t">How I learn a system</title>
<desc id="d">A cycle. Map the big picture first. Attach new pieces to it as chunks with meaning. Retrieve and space them on a schedule. Interleave other subjects to seed ideas. Build or teach it to test it. Then refactor the map and go round again.</desc>
<defs>
<marker id="hfw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hfw" d="M0 0 L10 5 L0 10 Z"/></marker>
<marker id="hbk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hbk" d="M0 0 L10 5 L0 10 Z"/></marker>
<marker id="hin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hin" d="M0 0 L10 5 L0 10 Z"/></marker>
</defs>
<style>
.judge{fill:#eaf2fd;stroke:#3a78c9} .core{fill:#1f6f43;stroke:#14512f} .chaos{fill:#fdf1e7;stroke:#d97a2b}
.ink{fill:#1f2328} .muted{fill:#4a525b} .on{fill:#ffffff} .git{fill:#8250df}
.fw{stroke:#57606a;fill:none} .bk{stroke:#3a78c9;fill:none} .in{stroke:#d97a2b;fill:none} .encl{stroke:#8c959f;fill:none}
.hfw{fill:#57606a} .hbk{fill:#3a78c9} .hin{fill:#d97a2b} .bkink{fill:#2f6db5} .grid{stroke:#d1d9e0}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme: dark){
.judge{fill:#12233a;stroke:#5b9be6} .core{fill:#2ea062;stroke:#7ee2a8} .chaos{fill:#2a1d12;stroke:#e08a3c}
.ink{fill:#f0f6fc} .muted{fill:#b1b8c0} .on{fill:#04150c} .git{fill:#c297ff}
.fw{stroke:#8b949e} .bk{stroke:#5b9be6} .in{stroke:#e08a3c} .encl{stroke:#6e7681}
.hfw{fill:#8b949e} .hbk{fill:#5b9be6} .hin{fill:#e08a3c} .bkink{fill:#7fb3f0} .grid{stroke:#30363d}
}
</style>
<rect class="chaos" x="8" y="8" width="22" height="14" rx="4" stroke-width="2" stroke-dasharray="4 3"/>
<text class="muted" x="36" y="20" font-size="12" text-anchor="start">me, or the world</text>
<rect class="judge" x="160" y="8" width="22" height="14" rx="4" stroke-width="2"/>
<text class="muted" x="188" y="20" font-size="12" text-anchor="start">a mind decides (person or agent)</text>
<rect class="core" x="390" y="8" width="22" height="14" rx="4" stroke-width="2"/>
<text class="muted" x="418" y="20" font-size="12" text-anchor="start">a program or structure holds it</text>
<rect class="judge" x="215" y="44" width="210" height="70" rx="10" stroke-width="2"/>
<text class="ink" x="320.0" y="65" font-size="15" font-weight="700" text-anchor="middle">Map the big picture</text>
<text class="muted" x="320.0" y="82" font-size="12.5" text-anchor="middle">Sung: 50 to 60% formed first</text>
<text class="muted" x="320.0" y="97" font-size="12.5" text-anchor="middle">then pieces attach fast</text>
<rect class="judge" x="420" y="150" width="210" height="70" rx="10" stroke-width="2"/>
<text class="ink" x="525.0" y="171" font-size="15" font-weight="700" text-anchor="middle">Attach pieces</text>
<text class="muted" x="525.0" y="188" font-size="12.5" text-anchor="middle">chunks tied to meaning</text>
<text class="muted" x="525.0" y="203" font-size="12.5" text-anchor="middle">Colvin: words, not letters</text>
<rect class="core" x="360" y="300" width="210" height="70" rx="10" stroke-width="2"/>
<text class="on" x="465.0" y="321" font-size="15" font-weight="700" text-anchor="middle">Retrieve and space</text>
<text class="on" x="465.0" y="338" font-size="12.5" text-anchor="middle">Dunlosky: testing, spacing</text>
<text class="on" x="465.0" y="353" font-size="12.5" text-anchor="middle">SuperMemo, Readwise review</text>
<rect class="judge" x="70" y="300" width="210" height="70" rx="10" stroke-width="2"/>
<text class="ink" x="175.0" y="321" font-size="15" font-weight="700" text-anchor="middle">Interleave</text>
<text class="muted" x="175.0" y="338" font-size="12.5" text-anchor="middle">strengthen memory and</text>
<text class="muted" x="175.0" y="353" font-size="12.5" text-anchor="middle">seed a well-stocked mind</text>
<rect class="judge" x="10" y="150" width="210" height="70" rx="10" stroke-width="2"/>
<text class="ink" x="115.0" y="171" font-size="15" font-weight="700" text-anchor="middle">Build or teach it</text>
<text class="muted" x="115.0" y="188" font-size="12.5" text-anchor="middle">Colvin: feedback, repetition</text>
<text class="muted" x="115.0" y="203" font-size="12.5" text-anchor="middle">Kane: say what you saw</text>
<path class="fw" d="M425 90 C520 90 525 110 525 146" stroke-width="2" marker-end="url(#hfw)"/>
<path class="fw" d="M525 220 L490 296" stroke-width="2" marker-end="url(#hfw)"/>
<path class="fw" d="M360 335 L284 335" stroke-width="2" marker-end="url(#hfw)"/>
<path class="fw" d="M150 300 L120 224" stroke-width="2" marker-end="url(#hfw)"/>
<path class="bk" d="M115 150 C115 100 140 79 211 79" stroke-width="2" marker-end="url(#hbk)"/>
<text class="bkink" x="14" y="112" font-size="12.5" text-anchor="start">refactor the map</text>
<text class="bkink" x="320" y="250" font-size="12.5" text-anchor="middle">Sung: refactoring is just learning</text>
</svg>
