<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="100%" role="img" aria-labelledby="t d">
<title id="t">From novice to flow</title>
<desc id="d">A novice sees letters. Deliberate practice with feedback builds chunks. Without it, performance stalls at an automatic plateau. Articulated mastery sees words and their meaning and can teach it. Flow builds on that mastery: near-effortless performance with high comprehension. New feedback loops send mastery back into practice.</desc>
<defs>
<marker id="hfw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hfw" d="M0 0 L10 5 L0 10 Z"/></marker>
<marker id="hbk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hbk" d="M0 0 L10 5 L0 10 Z"/></marker>
<marker id="hin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hin" d="M0 0 L10 5 L0 10 Z"/></marker>
</defs>
<style>
.judge{fill:#eaf2fd;stroke:#3a78c9} .core{fill:#1f6f43;stroke:#14512f} .chaos{fill:#fdf1e7;stroke:#d97a2b}
.ink{fill:#1f2328} .muted{fill:#4a525b} .on{fill:#ffffff} .git{fill:#8250df}
.fw{stroke:#57606a;fill:none} .bk{stroke:#3a78c9;fill:none} .in{stroke:#d97a2b;fill:none} .encl{stroke:#8c959f;fill:none}
.hfw{fill:#57606a} .hbk{fill:#3a78c9} .hin{fill:#d97a2b} .bkink{fill:#2f6db5} .grid{stroke:#d1d9e0}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme: dark){
.judge{fill:#12233a;stroke:#5b9be6} .core{fill:#2ea062;stroke:#7ee2a8} .chaos{fill:#2a1d12;stroke:#e08a3c}
.ink{fill:#f0f6fc} .muted{fill:#b1b8c0} .on{fill:#04150c} .git{fill:#c297ff}
.fw{stroke:#8b949e} .bk{stroke:#5b9be6} .in{stroke:#e08a3c} .encl{stroke:#6e7681}
.hfw{fill:#8b949e} .hbk{fill:#5b9be6} .hin{fill:#e08a3c} .bkink{fill:#7fb3f0} .grid{stroke:#30363d}
}
</style>
<rect class="chaos" x="8" y="8" width="22" height="14" rx="4" stroke-width="2" stroke-dasharray="4 3"/>
<text class="muted" x="36" y="20" font-size="12" text-anchor="start">me, or the world</text>
<rect class="judge" x="160" y="8" width="22" height="14" rx="4" stroke-width="2"/>
<text class="muted" x="188" y="20" font-size="12" text-anchor="start">a mind decides (person or agent)</text>
<rect class="core" x="390" y="8" width="22" height="14" rx="4" stroke-width="2"/>
<text class="muted" x="418" y="20" font-size="12" text-anchor="start">a program or structure holds it</text>
<rect class="judge" x="8" y="130" width="130" height="70" rx="10" stroke-width="2"/>
<text class="ink" x="73.0" y="151" font-size="15" font-weight="700" text-anchor="middle">Novice</text>
<text class="muted" x="73.0" y="168" font-size="12.5" text-anchor="middle">sees letters</text>
<text class="muted" x="73.0" y="183" font-size="12.5" text-anchor="middle">Kane: needs courage</text>
<rect class="judge" x="170" y="130" width="140" height="70" rx="10" stroke-width="2"/>
<text class="ink" x="240.0" y="151" font-size="15" font-weight="700" text-anchor="middle">Deliberate practice</text>
<text class="muted" x="240.0" y="168" font-size="12.5" text-anchor="middle">feedback, repetition</text>
<text class="muted" x="240.0" y="183" font-size="12.5" text-anchor="middle">Colvin, Van Horne</text>
<rect class="chaos" x="170" y="248" width="140" height="66" rx="10" stroke-width="2" stroke-dasharray="6 4"/>
<text class="ink" x="240.0" y="269" font-size="15" font-weight="700" text-anchor="middle">Automatic plateau</text>
<text class="muted" x="240.0" y="286" font-size="12.5" text-anchor="middle">stops improving</text>
<text class="muted" x="240.0" y="301" font-size="12.5" text-anchor="middle">Colvin, Luu</text>
<rect class="judge" x="342" y="130" width="140" height="70" rx="10" stroke-width="2"/>
<text class="ink" x="412.0" y="151" font-size="15" font-weight="700" text-anchor="middle">Articulated</text>
<text class="muted" x="412.0" y="168" font-size="12.5" text-anchor="middle">sees words, meaning</text>
<text class="muted" x="412.0" y="183" font-size="12.5" text-anchor="middle">can teach it</text>
<rect class="core" x="512" y="130" width="120" height="70" rx="10" stroke-width="2"/>
<text class="on" x="572.0" y="151" font-size="15" font-weight="700" text-anchor="middle">Flow</text>
<text class="on" x="572.0" y="168" font-size="12.5" text-anchor="middle">near-effortless</text>
<text class="on" x="572.0" y="183" font-size="12.5" text-anchor="middle">high comprehension</text>
<path class="fw" d="M138 165 L166 165" stroke-width="2" marker-end="url(#hfw)"/>
<path class="fw" d="M310 165 L338 165" stroke-width="2" marker-end="url(#hfw)"/>
<path class="fw" d="M482 165 L508 165" stroke-width="2" marker-end="url(#hfw)"/>
<path class="fw" d="M240 200 L240 244" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#hfw)"/>
<text class="muted" x="250" y="228" font-size="12" text-anchor="start">no feedback</text>
<path class="bk" d="M412 130 C412 70 240 70 240 126" stroke-width="2" marker-end="url(#hbk)"/>
<text class="bkink" x="326" y="64" font-size="12.5" text-anchor="middle">a new feedback loop</text>
</svg>
