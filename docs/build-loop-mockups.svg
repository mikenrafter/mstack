<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 860" width="100%" role="img" aria-labelledby="t d">
<title id="t">The mock-up cycle</title>
<desc id="d">The orchestrator writes each mock-up version itself and shows it as a pair: an inline page and a PNG. I read it and Gemini Neon reads it for legibility at the same time; the orchestrator folds both into the next version. Once I sign off, ui-brief-check fails any UI brief that does not name the mock-up, the original screen and every prior pilot. The build is compared with the mock-up in screenshot pairs until they match, and the PR body shows the journey.</desc>
<defs>
<marker id="hfw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hfw" d="M0 0 L10 5 L0 10 Z"/></marker>
<marker id="hbk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hbk" d="M0 0 L10 5 L0 10 Z"/></marker>
<marker id="hin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hin" d="M0 0 L10 5 L0 10 Z"/></marker>
</defs>
<style>
.judge{fill:#eaf2fd;stroke:#3a78c9} .core{fill:#1f6f43;stroke:#14512f} .chaos{fill:#fdf1e7;stroke:#d97a2b}
.ink{fill:#1f2328} .muted{fill:#4a525b} .on{fill:#ffffff} .git{fill:#8250df}
.fw{stroke:#57606a;fill:none} .bk{stroke:#3a78c9;fill:none} .in{stroke:#d97a2b;fill:none} .encl{stroke:#8c959f;fill:none}
.hfw{fill:#57606a} .hbk{fill:#3a78c9} .hin{fill:#d97a2b} .bkink{fill:#2f6db5} .grid{stroke:#d1d9e0}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme: dark){
.judge{fill:#12233a;stroke:#5b9be6} .core{fill:#2ea062;stroke:#7ee2a8} .chaos{fill:#2a1d12;stroke:#e08a3c}
.ink{fill:#f0f6fc} .muted{fill:#b1b8c0} .on{fill:#04150c} .git{fill:#c297ff}
.fw{stroke:#8b949e} .bk{stroke:#5b9be6} .in{stroke:#e08a3c} .encl{stroke:#6e7681}
.hfw{fill:#8b949e} .hbk{fill:#5b9be6} .hin{fill:#e08a3c} .bkink{fill:#7fb3f0} .grid{stroke:#30363d}
}
</style>
<rect class="chaos" x="8" y="8" width="22" height="14" rx="4" stroke-width="2" stroke-dasharray="4 3"/>
<text class="muted" x="36" y="20" font-size="12" text-anchor="start">me, or the world</text>
<rect class="judge" x="150" y="8" width="22" height="14" rx="4" stroke-width="2"/>
<text class="muted" x="178" y="20" font-size="12" text-anchor="start">an agent decides</text>
<rect class="core" x="292" y="8" width="22" height="14" rx="4" stroke-width="2"/>
<text class="muted" x="320" y="20" font-size="12" text-anchor="start">a program decides</text>
<text class="git mono" x="440" y="20" font-size="12" text-anchor="start">git</text>
<line class="bk" x1="470" y1="16" x2="500" y2="16" stroke-width="2"/>
<text class="muted" x="506" y="20" font-size="12" text-anchor="start">back edge</text>
<rect class="judge" x="235" y="50" width="170" height="64" rx="10" stroke-width="2"/>
<text class="ink" x="320.0" y="71" font-size="15" font-weight="700" text-anchor="middle">Write version N</text>
<text class="muted" x="320.0" y="88" font-size="12.5" text-anchor="middle">the orchestrator, never</text>
<text class="muted" x="320.0" y="103" font-size="12.5" text-anchor="middle">an implementer</text>
<rect class="core" x="235" y="150" width="170" height="64" rx="10" stroke-width="2"/>
<text class="on" x="320.0" y="171" font-size="15" font-weight="700" text-anchor="middle">Shown as a pair</text>
<text class="on" x="320.0" y="188" font-size="12.5" text-anchor="middle">inline page and PNG</text>
<text class="on mono" x="320.0" y="203" font-size="11.5" text-anchor="middle">kept in the journey</text>
<rect class="chaos" x="20" y="260" width="170" height="50" rx="10" stroke-width="2" stroke-dasharray="6 4"/>
<text class="ink" x="105.0" y="290.0" font-size="15" font-weight="700" text-anchor="middle">I read it</text>
<rect class="judge" x="420" y="260" width="160" height="64" rx="10" stroke-width="2"/>
<text class="ink" x="500.0" y="281" font-size="15" font-weight="700" text-anchor="middle">Neon reads it</text>
<text class="muted" x="500.0" y="298" font-size="12.5" text-anchor="middle">for legibility,</text>
<text class="muted" x="500.0" y="313" font-size="12.5" text-anchor="middle">at the same time</text>
<rect class="judge" x="235" y="350" width="170" height="64" rx="10" stroke-width="2"/>
<text class="ink" x="320.0" y="371" font-size="15" font-weight="700" text-anchor="middle">Fold both in</text>
<text class="muted" x="320.0" y="388" font-size="12.5" text-anchor="middle">what each one caught</text>
<rect class="core" x="235" y="470" width="170" height="80" rx="10" stroke-width="2"/>
<text class="on" x="320.0" y="491" font-size="15" font-weight="700" text-anchor="middle">ui-brief-check</text>
<text class="on" x="320.0" y="508" font-size="12.5" text-anchor="middle">names the mock-up, the</text>
<text class="on" x="320.0" y="523" font-size="12.5" text-anchor="middle">original screen, every</text>
<text class="on" x="320.0" y="538" font-size="12.5" text-anchor="middle">prior pilot</text>
<rect class="judge" x="235" y="590" width="170" height="64" rx="10" stroke-width="2"/>
<text class="ink" x="320.0" y="611" font-size="15" font-weight="700" text-anchor="middle">Build</text>
<text class="muted" x="320.0" y="628" font-size="12.5" text-anchor="middle">reuse first; new code</text>
<text class="muted" x="320.0" y="643" font-size="12.5" text-anchor="middle">only for what&#x27;s new</text>
<rect class="judge" x="235" y="690" width="170" height="64" rx="10" stroke-width="2"/>
<text class="ink" x="320.0" y="711" font-size="15" font-weight="700" text-anchor="middle">Screenshot pairs</text>
<text class="muted" x="320.0" y="728" font-size="12.5" text-anchor="middle">build beside mock-up;</text>
<text class="muted" x="320.0" y="743" font-size="12.5" text-anchor="middle">another model checks</text>
<rect class="judge" x="235" y="790" width="170" height="50" rx="10" stroke-width="2"/>
<text class="ink" x="320.0" y="820.0" font-size="15" font-weight="700" text-anchor="middle">PR shows the journey</text>
<path class="fw" d="M320 114 L320 146" stroke-width="2" marker-end="url(#hfw)"/>
<path class="fw" d="M260 214 C220 240 160 240 130 256" stroke-width="2" marker-end="url(#hfw)"/>
<path class="fw" d="M380 214 C420 240 470 240 495 256" stroke-width="2" marker-end="url(#hfw)"/>
<path class="fw" d="M150 310 C170 350 200 370 231 375" stroke-width="2" marker-end="url(#hfw)"/>
<path class="fw" d="M495 324 C470 350 440 370 409 375" stroke-width="2" marker-end="url(#hfw)"/>
<path class="bk" d="M405 382 C668 382 668 82 409 82" stroke-width="2" marker-end="url(#hbk)"/>
<text class="bkink" x="620" y="232" font-size="11.5" text-anchor="middle" transform="rotate(-90 620 232)">next version</text>
<path class="fw" d="M90 310 C90 420 150 500 231 505" stroke-width="2" marker-end="url(#hfw)"/>
<text class="muted" x="84" y="400" font-size="11.5" text-anchor="end">signed off</text>
<path class="fw" d="M320 550 L320 586" stroke-width="2" marker-end="url(#hfw)"/>
<path class="fw" d="M320 654 L320 686" stroke-width="2" marker-end="url(#hfw)"/>
<path class="bk" d="M405 722 C450 722 450 622 409 622" stroke-width="2" marker-end="url(#hbk)"/>
<text class="bkink" x="452" y="676" font-size="11.5" text-anchor="start">they don&#x27;t match</text>
<path class="fw" d="M320 754 L320 786" stroke-width="2" marker-end="url(#hfw)"/>
<text class="muted" x="326" y="774" font-size="11.5" text-anchor="start">they match</text>
<text class="git mono" x="415" y="822" font-size="11.5" text-anchor="start">PNG or GIF of every version</text>
</svg>
