<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" width="100%" role="img" aria-labelledby="t d">
<title id="t">Review bars by stage for an example feature</title>
<desc id="d">A radar chart of review bars from 6 to 10 on eight concerns, for an example feature that writes the user's data, in three stages. Pilot: legibility 8, architecture 7, testability 6, durability 9, error paths 7, concurrency 6, performance 6, security 6. Structural: 8, 10, 8, 8, 8, 8, 7, 9. Hardening: 7, 8, 8, 9, 8, 9, 8, 9.</desc>
