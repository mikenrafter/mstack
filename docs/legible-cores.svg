<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" width="100%" role="img" aria-labelledby="t d">
  <title id="t">A legible core</title>
  <desc id="d">Three nested rings. In the center, a deterministic core. Around it, judgement by the agent or the owner. Outside, the chaos of reality.</desc>
  <style>
    .chaos{fill:#fdf1e7;stroke:#d97a2b}
    .edge{fill:#eaf2fd;stroke:#3a78c9}
    .core{fill:#1f6f43;stroke:#14512f}
    .ink{fill:#1f2328} .muted{fill:#4a525b} .on-core{fill:#ffffff}
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    @media (prefers-color-scheme: dark){
      .chaos{fill:#2a1d12;stroke:#e08a3c}
      .edge{fill:#12233a;stroke:#5b9be6}
      .core{fill:#2ea062;stroke:#7ee2a8}
      .ink{fill:#f0f6fc} .muted{fill:#b1b8c0} .on-core{fill:#04150c}
    }
  </style>
  <path class="chaos" stroke-width="3" stroke-dasharray="9 7"
    d="M260 8 C360 4 470 34 506 104 C532 160 516 232 468 276 C412 322 330 324 260 322 C184 324 102 320 54 276 C6 232 -8 160 18 106 C54 36 160 10 260 8 Z"/>
  <ellipse class="edge" stroke-width="3" cx="260" cy="200" rx="200" ry="112"/>
  <ellipse class="core" stroke-width="3" cx="260" cy="230" rx="118" ry="62"/>
  <text class="ink" x="260" y="44" text-anchor="middle" font-size="28" font-weight="700">Reality</text>
  <text class="muted" x="260" y="70" text-anchor="middle" font-size="19">users, hardware, other people</text>
  <text class="ink" x="260" y="124" text-anchor="middle" font-size="26" font-weight="700">Judgement</text>
  <text class="muted" x="260" y="150" text-anchor="middle" font-size="19">the agent, or me</text>
  <text class="on-core" x="260" y="226" text-anchor="middle" font-size="28" font-weight="700">Core</text>
  <text class="on-core" x="260" y="254" text-anchor="middle" font-size="19">a clock, a ledger, a test</text>
</svg>
