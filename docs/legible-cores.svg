<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="100%" role="img" aria-labelledby="t d">
  <title id="t">A legible core</title>
  <desc id="d">Three concentric circles. In the center, a deterministic core: a clock, a ledger, a test. Around it, judgement by the agent or the owner. Outside, reality: users, hardware, other people.</desc>
  <style>
    .chaos{fill:#fdf1e7;stroke:#d97a2b}
    .edge{fill:#eaf2fd;stroke:#3a78c9}
    .core{fill:#1f6f43;stroke:#14512f}
    .lead{stroke:#8c959f;fill:none} .dot{fill:#8c959f}
    .ink{fill:#1f2328} .muted{fill:#4a525b}
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    @media (prefers-color-scheme: dark){
      .chaos{fill:#2a1d12;stroke:#e08a3c}
      .edge{fill:#12233a;stroke:#5b9be6}
      .core{fill:#2ea062;stroke:#7ee2a8}
      .lead{stroke:#6e7681} .dot{fill:#6e7681}
      .ink{fill:#f0f6fc} .muted{fill:#b1b8c0}
    }
  </style>
  <circle class="chaos" stroke-width="3" stroke-dasharray="9 7" cx="160" cy="160" r="148"/>
  <circle class="edge" stroke-width="3" cx="160" cy="160" r="98"/>
  <circle class="core" stroke-width="3" cx="160" cy="160" r="48"/>

  <!-- leader lines from each ring to its label -->
  <g class="lead" stroke-width="1.5">
    <path d="M176 150 L300 110 L336 110"/>
    <path d="M226 191 L300 190 L336 190"/>
    <path d="M267 222 L300 270 L336 270"/>
  </g>
  <g class="dot"><circle cx="176" cy="150" r="4"/><circle cx="226" cy="191" r="4"/><circle cx="267" cy="222" r="4"/></g>

  <text class="ink"   x="344" y="108" font-size="22" font-weight="700">Core</text>
  <text class="muted" x="344" y="130" font-size="16">a clock, a ledger, a test</text>
  <text class="ink"   x="344" y="188" font-size="22" font-weight="700">Judgement</text>
  <text class="muted" x="344" y="210" font-size="16">the agent, or me</text>
  <text class="ink"   x="344" y="268" font-size="22" font-weight="700">Reality</text>
  <text class="muted" x="344" y="290" font-size="16">users, hardware, people</text>
</svg>
